version: '3.8'

services:
  frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: alzheimers_frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alzheimers_backend
    ports:
      - "8000:8000"
    restart: always
